              <script>
                const USERNAME = "wowjbblegend";
                const BASE_URL = `https://lastfm-last-played.biancarosa.com.br/${USERNAME}/latest-song`;
                
                const getTrack = async () => {
                    const request = await fetch(BASE_URL);
                    const json = await request.json();
                
                    let isPlaying = json.track['@attr']?.nowplaying || false;
                
                    
                    let htmllistenRN = "";

                    if (isPlaying) {
                        htmllistenRN = `<div class="now-playing">слушаю сейчас</div>`;
                    }
                
                    document.getElementById("listen").innerHTML = `
                        <img src="${json.track.image[1]['#text']}">
                        <div id="track">
                            <b id="trackName">${json.track.name}</b><br>
                            <i id="artistName">${json.track.artist['#text']}</i>
                            ${htmllistenRN}
                        </div>
                    `;
                };
                
                getTrack();
                setInterval(getTrack, 10000);
                </script>
